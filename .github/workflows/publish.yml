name: Publish to npm

# Publishes when a GitHub Release is published. Uses npm trusted publishing
# (OIDC), so no NPM_TOKEN secret is needed. The trusted publisher configured
# on npmjs.com must reference this workflow file name: publish.yml
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Set package.json version from release tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $GITHUB_REF_NAME is not a vX.Y.Z version"
            exit 1
          fi
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm publish --access public
